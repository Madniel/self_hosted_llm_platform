[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmserve"
version = "0.1.0"
description = "Self-hosted LLM serving platform: FastAPI + vLLM with streaming and admission control"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["llmserve", "llmserve.engine", "llmserve.routes", "loadtest"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
